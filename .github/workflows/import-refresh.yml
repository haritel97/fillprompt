name: Import refresh

on:
  schedule:
    # Weekly Wednesday 10:00 UTC — refresh catalogs after Monday's media check.
    - cron: '0 10 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch sources and rebuild catalogs
        env:
          # Lifts the unauthenticated GitHub API limit while listing community skills.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run import:fresh
      - name: Verify MCP catalog JSON
        run: npm run mcp:verify
      - name: Tests
        run: npm test
      - name: Build the site
        run: npm run build
      - name: Sample media still loads
        run: node scripts/sample-media.mjs --limit 6
      # Requires: repo Settings → Actions → General → allow GitHub Actions to create and approve pull requests.
      - name: Open PR if data changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/import-refresh
          delete-branch: true
          title: Refresh open-source prompt catalogs
          commit-message: |
            Refresh open-source prompt catalogs.

            Re-fetch source collections and rebuild image, video, text, and MCP data.
          body: |
            Automated weekly import of the open-source prompt collections behind fillprompt.com.

            - Ran `npm run import:fresh` (re-download + rebuild `src/data`)
            - Ran `npm run mcp:verify`, `npm test`, `npm run build`, and a sample media HEAD check
            - Review the diff for unexpected drops or NSFW filter changes, then merge

            Triggered by schedule or workflow_dispatch.
          add-paths: |
            src/data/
            README.md
            server.json
            plugins/fillprompt/.claude-plugin/plugin.json
            plugins/fillprompt/skills/fillprompt/SKILL.md
            .claude-plugin/marketplace.json
      - name: Fallback PR via gh when Actions cannot open PRs
        if: steps.cpr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push local import commits if create-pull-request could not open the PR.
          if ! git ls-remote --exit-code origin refs/heads/chore/import-refresh; then
            git push -u origin HEAD:chore/import-refresh || true
          fi
          git fetch origin chore/import-refresh || true
          if git ls-remote --exit-code origin refs/heads/chore/import-refresh; then
            gh pr create --base main --head chore/import-refresh \
              --title "Refresh open-source prompt catalogs" \
              --body "Automated weekly import (fallback). Review data diffs, then merge." \
              || gh pr list --head chore/import-refresh --json url --jq '.[0].url'
          else
            echo "No import branch to open a PR from."
          fi
          exit 0
